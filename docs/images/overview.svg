<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">TakeoutDateRepair</title>
  <desc id="desc">Дата из JSON возвращается в фото. Локальная обработка экспорта Google Фото для Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c172b"/><stop offset="1" stop-color="#172d4d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#61d3fd"/><stop offset="1" stop-color="#7395ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="-25" r="290" fill="#3c81cc" opacity=".09"/>
  <circle cx="1180" cy="550" r="250" fill="#40e0c0" opacity=".06"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="64" y="55" width="278" height="34" rx="17" fill="#203951"/>
    <circle cx="84" cy="72" r="5" fill="#70e1c0"/>
    <text x="99" y="78" font-size="15" fill="#bdd4e9" letter-spacing="1.1">WINDOWS · OFFLINE · UTC</text>
    <text x="64" y="157" fill="#fff" font-size="60" font-weight="700" letter-spacing="-2">TakeoutDateRepair</text>
    <text x="67" y="207" fill="#c6d6eb" font-size="26">Вернуть фотографиям их даты.</text>
    <text x="67" y="245" fill="#8ea9c8" font-size="20">Из экспорта Google Фото — в аккуратную библиотеку.</text>
    <g transform="translate(66 296)" filter="url(#shadow)">
      <rect width="330" height="144" rx="16" fill="#f5f8ff"/>
      <rect x="20" y="21" width="48" height="48" rx="10" fill="#dbeafe"/>
      <path d="M29 57l11-14 9 9 8-11 5 16z" fill="#4c83d8"/><circle cx="54" cy="34" r="5" fill="#4c83d8"/>
      <text x="84" y="43" font-size="20" font-weight="700" fill="#142c4a">photo.jpg + JSON</text>
      <text x="21" y="102" font-size="17" fill="#506882">photoTakenTime.timestamp</text>
      <text x="21" y="126" font-size="15" fill="#7b8ea6">Медиа и отдельные метаданные</text>
    </g>
    <g fill="none" stroke="#68baf7" stroke-width="3" stroke-linecap="round"><path d="M420 368h62"/><path d="M472 358l11 10-11 10"/></g>
    <g transform="translate(508 296)" filter="url(#shadow)">
      <rect width="332" height="144" rx="16" fill="#f5f8ff"/>
      <rect x="20" y="21" width="48" height="48" rx="10" fill="#d9f6e9"/>
      <path d="M32 45l8 8 16-19" fill="none" stroke="#168859" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="43" font-size="20" font-weight="700" fill="#142c4a">Готовое фото</text>
      <text x="21" y="102" font-size="17" fill="#506882">EXIF · XMP · даты Windows</text>
      <text x="21" y="126" font-size="15" fill="#7b8ea6">Проверено перед перемещением</text>
    </g>
    <g transform="translate(957 142)">
      <rect x="0" y="0" width="330" height="273" rx="22" fill="#203952" stroke="#36536c"/>
      <text x="28" y="43" font-size="14" fill="#92b2ce" letter-spacing="2">ПРОСТОЙ ПРОЦЕСС</text>
      <g fill="#c8dcf0" font-size="20">
        <circle cx="38" cy="87" r="14" fill="#345b7e"/><text x="33" y="94" font-size="17" fill="#90d9ff">1</text><text x="67" y="94">Найти пары</text>
        <circle cx="38" cy="139" r="14" fill="#345b7e"/><text x="33" y="146" font-size="17" fill="#90d9ff">2</text><text x="67" y="146">Восстановить дату</text>
        <circle cx="38" cy="191" r="14" fill="#345b7e"/><text x="33" y="198" font-size="17" fill="#90d9ff">3</text><text x="67" y="198">Проверить результат</text>
      </g>
      <text x="29" y="245" font-size="15" fill="#8caac4">Без загрузки фотографий в облако</text>
    </g>
    <text x="67" y="483" font-size="15" fill="#718fac">Пары обрабатываются. Одиночные файлы ждут следующую часть Takeout.</text>
  </g>
</svg>
